name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: linux_gcc_64
          - os: windows-2022
            platform: windows
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libx11-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb-cursor0 libasound2 ninja-build ffmpeg
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: qtimageformats qtshadertools
          source: true
          src-archives: qtbase qtdeclarative qtimageformats qtsvg qtshadertools qtwayland
          cache: true
      - name: Verify Rust
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Fetch verified media tools
        run: python packaging/fetch-tools.py ${{ matrix.platform }}
      - name: Add media tools to test path
        shell: bash
        run: echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
      - name: Compile native Qt application
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Verify native interface
        env:
          CHARLITA_UI_CAPTURE_DIR: ${{ github.workspace }}/dist/ui-checks
        run: |
          cmake --build build --target charlita_qmllint
          ctest --test-dir build --output-on-failure
      - name: Install packaging utilities
        run: cargo install cargo-bundle-licenses --version 4.2.0 --locked
      - name: Install Windows installer builder
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Deploy Qt and package
        shell: bash
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/dist/stage"
          python packaging/package.py --stage dist/stage --qt-sources "$QT_ROOT_DIR/../Src"
      - name: Verify deployed startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python packaging/check-startup.py dist/stage
      - name: Verify Windows installation and uninstall
        if: runner.os == 'Windows'
        run: python packaging/check-windows-installer.py dist/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charlita-${{ matrix.platform }}
          path: |
            dist/packages/*
            dist/ui-checks/*
            dist/deployed.png
            build/Testing/Temporary/LastTest.log
            build/Testing/native-ui.txt
          if-no-files-found: warn
