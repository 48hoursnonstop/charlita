[package]
name = "charlita"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native reactive Discord guest overlays for OBS and Streamlabs"
license = "MIT"
repository = "https://github.com/48hoursnonstop/charlita"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "query"] }
base64 = "0.22"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland", "accesskit"] }
fs2 = "0.4"
futures-util = "0.3"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
ksni = "0.3"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
keyring = { version = "3.6", features = ["windows-native"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tokio-tungstenite = "0.29"

[package.metadata.packager]
product-name = "Charlita"
identifier = "io.github.48hoursnonstop.charlita"
category = "Utility"
icons = ["packaging/icon.png"]
resources = ["tools/*"]
before-packaging-command = "cargo build --release --locked"

[package.metadata.packager.deb]
depends = ["libx11-6", "libxkbcommon0", "libgl1"]
